
name: PR Validation - Build macOS and Windows wheels

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheels-macos:
    name: Build wheels (macOS arm64 + x86_64 cross-compile)
    # macos-13 (Intel) was retired Sep 2025. Use arm64 runner and cross-compile
    # for x86_64 via the macOS SDK - cibuildwheel supports this natively.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_SKIP: "pp* cp313t-* cp314t-*"
          CIBW_TEST_SKIP: "*"
          CIBW_DEPENDENCY_VERSIONS: "latest"
          CIBW_BEFORE_BUILD: "python -m pip install -U pip setuptools wheel numpy"

      - name: Verify wheel was built
        run: |
          ls -la wheelhouse/
          echo "✅ macOS wheels (arm64 + x86_64) built successfully"

  wheels-windows:
    name: Build wheels (Windows)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install packaging
        run: pip install --upgrade 'packaging>=24.2'

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_SKIP: "pp* *-win32 cp313t-* cp314t-*"
          # Skip testing to speed up builds
          CIBW_TEST_SKIP: "*"
          # Use latest dependency versions to get packaging>=24.2
          CIBW_DEPENDENCY_VERSIONS: "latest"
          CIBW_BEFORE_BUILD: "python -m pip install -U pip setuptools wheel numpy"

      - name: Verify wheel was built
        run: |
          dir wheelhouse\
          echo "✅ Windows AMD64 wheel built successfully"

  validation-summary:
    name: PR Validation Summary
    needs: [wheels-macos, wheels-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Validation complete
        run: |
          echo "🎉 PR validation passed!"
          echo "✅ macOS wheels (x86_64, arm64) built successfully"
          echo "✅ Windows wheels (AMD64) built successfully"
          echo ""
          echo "Ready for merge! Full platform testing will run on release."
