name: Wheels (build + musllinux) and Publish

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write
  id-token: write

jobs:
  wheels-linux:
    name: Build wheels (Linux ${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable QEMU (for aarch64 emulation)
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v4.1.0
        env:
          # Build wheels for CPython 3.12, 3.13, 3.14 (covers HA-ish + newest)
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          # Skip PyPy + 32-bit + i686 musllinux + free-threaded tags (cp313t/cp314t)
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_i686 cp313t-* cp314t-*"

          CIBW_ARCHS_LINUX: ${{ matrix.arch }}

          # manylinux images
          CIBW_MANYLINUX_X86_64: manylinux_2_17
          CIBW_MANYLINUX_AARCH64: manylinux_2_17

          # musllinux images
          CIBW_MUSLLINUX_X86_64: musllinux_1_2
          CIBW_MUSLLINUX_AARCH64: musllinux_1_2

          # If your extension needs numpy headers at build time, ensure numpy is installed
          # inside the wheel build environment before compilation.
          CIBW_BEFORE_BUILD: "python -m pip install -U pip setuptools wheel numpy"

          # Musllinux containers are Alpine-based; make sure build tools exist.
          # (Safe even if already installed)
          CIBW_BEFORE_ALL_LINUX: >
            sh -c "if command -v apk >/dev/null 2>&1; then
              apk add --no-cache build-base linux-headers;
            fi"

          # Skip tests to speed up wheels job (you test in sdist job)
          CIBW_TEST_SKIP: "*"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  wheels-macos:
    name: Build wheels (macOS arm64 + x86_64 cross-compile)
    # macos-13 (Intel) was retired Sep 2025. Use arm64 runner and cross-compile
    # for x86_64 via the macOS SDK - cibuildwheel supports this natively.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_SKIP: "pp* cp313t-* cp314t-*"
          CIBW_TEST_SKIP: "*"
          CIBW_DEPENDENCY_VERSIONS: "latest"
          CIBW_BEFORE_BUILD: "python -m pip install -U pip setuptools wheel numpy"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos
          path: wheelhouse/*.whl
          if-no-files-found: error

  wheels-windows:
    name: Build wheels (Windows)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_SKIP: "pp* *-win32 cp313t-* cp314t-*"
          CIBW_TEST_SKIP: "*"
          CIBW_DEPENDENCY_VERSIONS: "latest"
          CIBW_BEFORE_BUILD: "python -m pip install -U pip setuptools wheel numpy"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Build sdist and smoke-test (CPython 3.13)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install build backend and test dependencies
        run: |
          python -m pip install --upgrade build
          python -m pip install -U numpy pillow

      - name: Build sdist
        run: python -m build -s

      - name: Install package from sdist and smoke-test
        run: |
          python -m pip install dist/*.tar.gz
          python -c "import mvcrender; from mvcrender.autocrop import AutoCrop; print('Package import successful!')"
          python tests/smoke.py

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI and GitHub Release (on GitHub Release)
    needs: [ wheels-linux, wheels-macos, wheels-windows, sdist ]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/mvcrender
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect distributions for publishing
        shell: bash
        run: |
          mkdir -p dist
          cp artifacts/sdist/*.tar.gz dist/
          find artifacts -name "*.whl" -exec cp {} dist/ \;
          echo "All distributions collected:"
          ls -lah dist/

      - name: Upload distributions to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          packages-dir: dist/
          print-hash: true
          verify-metadata: true
          attestations: true